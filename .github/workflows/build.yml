name: CI Build and Release

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [windows-latest, macos-13]

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Set up Developer Command Prompt (Windows)
      if: runner.os == 'Windows'
      uses: ilammy/msvc-dev-cmd@v1

    - name: Install Ninja (Windows & macOS)
      run: |
        if [ "$RUNNER_OS" == "Windows" ]; then
          choco install ninja
        elif [ "$RUNNER_OS" == "macOS" ]; then
          brew install ninja
        fi
      shell: bash

    - name: Set up CMake
      uses: jwlawson/actions-setup-cmake@v2
      with:
        cmake-version: '3.22.x'

    - name: Configure CMake (Windows)
      if: runner.os == 'Windows'
      run: cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release

    - name: Configure CMake (macOS)
      if: runner.os == 'macOS'
      run: |
        cmake -B build -G Ninja \
          -DCMAKE_BUILD_TYPE=Release \
          -DJUCE_BUILD_HELPER_TOOLS=OFF \
          -DJUCE_BUILD_EXTRAS=OFF

    - name: Build Plugin
      run: cmake --build build --config Release

    - name: Upload Artifacts (Windows)
      if: runner.os == 'Windows'
      uses: actions/upload-artifact@v4
      with:
        name: Electribe2Hacktribe-VST3-Windows
        path: build/Electribe2Hacktribe_artefacts/Release/

    - name: Upload Artifacts (macOS)
      if: runner.os == 'macOS'
      uses: actions/upload-artifact@v4
      with:
        name: Electribe2Hacktribe-AU-VST3-macOS
        path: build/Electribe2Hacktribe_artefacts/Release/
