name: CI Build and Release

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    
    strategy:
      matrix:
        os: [windows-latest, macos-13]

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Get JUCE Framework
      uses: actions/checkout@v4
      with:
        repository: juce-framework/JUCE
        ref: 8.0.0
        path: JUCE

    - name: Configure CMake (Windows)
      if: runner.os == 'Windows'
      run: cmake -B build -DCMAKE_PREFIX_PATH="${{ github.workspace }}/JUCE"

    - name: Configure CMake (macOS)
      if: runner.os == 'macOS'
      run: cmake -B build -DCMAKE_PREFIX_PATH="${{ github.workspace }}/JUCE"

    - name: Build Plugin
      run: cmake --build build --config Release

    - name: Upload Artifacts (Windows)
      if: runner.os == 'Windows'
      uses: actions/upload-artifact@v4
      with:
        name: Electribe2Hacktribe-VST3-Windows
        path: build/electribevst2_artefacts/Release/VST3/

    - name: Upload Artifacts (macOS)
      if: runner.os == 'macOS'
      uses: actions/upload-artifact@v4
      with:
        name: Electribe2Hacktribe-VST3-macOS
        path: build/electribevst2_artefacts/Release/VST3/
